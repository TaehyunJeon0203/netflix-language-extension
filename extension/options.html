<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Netflix Subtitle Learner settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <p class="eyebrow">Netflix Subtitle Learner</p>
      <h1>Optional dictionary</h1>
      <p class="description">The extension uses subtitle tracks supplied by Netflix. Add the free dictionary server endpoint only if you want English word definitions.</p>
      <form>
        <label for="backend-url">Dictionary server URL</label>
        <input id="backend-url" name="backendUrl" type="url" inputmode="url" placeholder="http://localhost:3000/api/analyze" />
        <button type="submit">Save settings</button>
        <p id="status" role="status" aria-live="polite"></p>
      </form>
    </main>
    <script src="options.js"></script>
  </body>
</html>
